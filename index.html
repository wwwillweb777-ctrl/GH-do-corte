<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fã Clube do Serginho Cabeção 🐸👑</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1208 0%, #2c1e0f 100%);
            background-image: 
                radial-gradient(#3a2a18 1px, transparent 1px),
                radial-gradient(#3a2a18 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Segoe UI', sans-serif;
            padding: 1rem;
            color: #fff;
        }
        .cartaz {
            max-width: 450px;
            margin: 0 auto;
            background: #000;
            border-radius: 24px;
            border: 3px solid #f4a900;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(244, 169, 0, 0.25);
            position: relative;
        }
        .menu-superior {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            text-align: center;
        }
        .botao-menu-superior button {
            background: #39ff14;
            color: #000;
            border: none;
            padding: 0.5rem 1.1rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #39ff14;
            transition: all 0.3s ease;
        }
        .botao-menu-superior button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #39ff14;
        }
        .seta-abaixo {
            font-size: 1.3rem;
            color: #39ff14;
            margin-top: 5px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .logo-topo {
            width: 100%;
            height: auto;
            display: block;
        }
        .logo-topo img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
        .conteudo-interno {
            padding: 2rem 1.5rem 2.5rem;
            text-align: center;
        }
        .mensagem-principal {
            font-size: 1.25rem;
            color: #f4a900;
            font-family: Georgia, serif;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .mensagem-sub {
            font-size: 0.95rem;
            color: #ccc;
        }
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .menu-overlay.aberto {
            display: flex;
        }
        .menu-conteudo {
            background: #111;
            border: 3px solid #f4a900;
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .menu-conteudo h2 {
            color: #f4a900;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
        .menu-opcao {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 1rem;
            margin-bottom: 0.8rem;
            background: #222;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        .menu-opcao:hover {
            background: #333;
            color: #39ff14;
        }
        .fechar-menu {
            margin-top: 1.5rem;
            background: transparent;
            border: 2px solid #f4a900;
            color: #f4a900;
            padding: 0.7rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="cartaz">
        <!-- Menu no canto superior direito - Botão em cima, seta embaixo apontando PARA CIMA -->
        <div class="menu-superior">
            <div class="botao-menu-superior">
                <button onclick="abrirMenu()">📋 MENU</button>
            </div>
            <div class="seta-abaixo">⬆️</div>
        </div>

        <div class="logo-topo">
            <img src="https://raw.githubusercontent.com/wwwillweb777-ctrl/faclube-do-serginho-cabecao/main/imagens/LogoSerginho.jpg" alt="Fã Clube do Serginho Cabeção">
        </div>

        <div class="conteudo-interno">
            <p class="mensagem-principal">👑 Bem-vindo ao Fã Clube do Serginho Cabeção</p>
            <p class="mensagem-sub">Clique no <span style="color:#39ff14; font-weight:bold;">MENU</span> acima para acessar tudo! 🐸</p>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menuOverlay" class="menu-overlay" onclick="fecharMenuFora(event)">
        <div class="menu-conteudo" onclick="event.stopPropagation()">
            <h2>🐸 Fã Clube — Menu</h2>
            
            <a href="chat.html" class="menu-opcao">💬 Conversar / Chat</a>
            <a href="gerenciar.html" class="menu-opcao">🔐 Área Administrativa</a>
            
            <button class="fechar-menu" onclick="fecharMenu()">✖️ Fechar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCjUBVWJ7f9A8hQXWBhWjLfWxgJ9lhh1YI",
            authDomain: "gabriel-do-corte.firebaseapp.com",
            databaseURL: "https://gabriel-do-corte-default-rtdb.firebaseio.com",
            projectId: "gabriel-do-corte",
            storageBucket: "gabriel-do-corte.firebasestorage.app",
            messagingSenderId: "877270325019",
            appId: "1:877270325019:web:8d75ee1b905a1b8f16a5be"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CHAVE_SESSAO = "sessao_faclube";
        window.onload = async function() {
            if (!sessionStorage.getItem(CHAVE_SESSAO)) {
                sessionStorage.setItem(CHAVE_SESSAO, 'ativa');
                const ref = db.ref("FãClube/visitas");
                const snap = await ref.once("value");
                const total = snap.val() || 0;
                await ref.set(total + 1);
            }
        };

        function abrirMenu() {
            document.getElementById('menuOverlay').classList.add('aberto');
            document.body.style.overflow = 'hidden';
        }
        function fecharMenu() {
            document.getElementById('menuOverlay').classList.remove('aberto');
            document.body.style.overflow = 'auto';
        }
        function fecharMenuFora(event) {
            if (event.target.id === 'menuOverlay') fecharMenu();
        }
    </script>
</body>
</html>
